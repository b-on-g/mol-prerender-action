name: "$mol Prerender for SEO"
description: "Prerender $mol SPA pages with Puppeteer for search engine indexing. Auto-detects build dir and root selector from index.html."

inputs:
  base-url:
    description: "Production URL for sitemap.xml (e.g. https://example.github.io/app/)"
    required: true
  screens:
    description: |
      Screen IDs to prerender, one per line. Each screen is navigated via route-key.
      Empty = only index.html. Title and description are extracted from the rendered page.
      Example:
        campaign
        shop
        leaderboard
    required: false
    default: ""
  route-format:
    description: >
      URL routing format: "#!" (hash, default), "?" (query string), or "path"
      (clean pathname). In "path" mode each screen is a full route string
      (e.g. section=docs/page=views), pages are written to <route>/index.html so a
      static host serves them at /<route> with a 200, and per-page <title>/meta/og/
      canonical/hreflang are injected from the app's data-bog-meta.
    required: false
    default: "#!"
  route-key:
    description: "URL parameter key for screen routing (unused in path mode)"
    required: false
    default: "screen"
  sitemap-file:
    description: >
      Optional path to a committed sitemap.xml. In "path" mode every <loc> under
      base-url is prerendered as a route (single source of truth for the route list).
    required: false
    default: ""
  viewport:
    description: "Viewport size as WIDTHxHEIGHT"
    required: false
    default: "430x932"
  timeout:
    description: "Render wait timeout in milliseconds"
    required: false
    default: "15000"
  route-content:
    description: >
      Optional. One path template per line, telling the action which source file
      a route's content comes from — that is all it needs to re-render only the
      pages that actually changed, instead of every route.

      A route is a set of `key=value` segments, so `{key}` is taken from the route
      itself and `{key=default}` falls back when the route has no such key:

        content/{mol_locale=en}/docs/{page}.md
        content/en/docs/{page}.md

      List every file the page may render from. The second line above matters:
      a locale that has no translation yet renders the English text, so its
      snapshot depends on the English file too.

      Everything under a template's literal prefix is treated as content — both the
      sources and whatever is generated from them — and is excluded from the shell
      hash. Everything else the bundle depends on is the shell: change any of it and
      all routes are re-rendered. A route whose template does not resolve is never
      skipped.

      Purely opt-in: without this input the action behaves exactly as before.
    required: false
    default: ""
  folder:
    description: "Path to the build output directory containing index.html (e.g. bog/blitz/blog/-). If omitted, auto-detects by searching for */app/-/index.html."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Detect build directory
      id: detect
      shell: bash
      run: |
        FOLDER="${{ inputs.folder }}"
        if [ -n "$FOLDER" ]; then
          BUILD_DIR="$FOLDER"
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "::error::index.html not found in specified folder: $BUILD_DIR"
            exit 1
          fi
        else
          # Find index.html with mol_view_root attribute
          BUILD_DIR=$(find . -path '*/-/index.html' -exec grep -l 'mol_view_root' {} \; | head -1 | xargs dirname)
          if [ -z "$BUILD_DIR" ]; then
            echo "::error::Could not find $mol build directory (looking for */-/index.html with mol_view_root)"
            exit 1
          fi
        fi
        echo "build-dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

        # Extract root selector from index.html
        ROOT_FQN=$(grep -oP 'mol_view_root="\$[^"]+' "$BUILD_DIR/index.html" | head -1 | sed 's/mol_view_root="//')
        echo "root-fqn=$ROOT_FQN" >> "$GITHUB_OUTPUT"
        echo "Detected: build-dir=$BUILD_DIR root=$ROOT_FQN"

    - name: Compute cache key
      id: cache-key
      shell: bash
      run: |
        BUILD_DIR="${{ steps.detect.outputs.build-dir }}"
        HASH=$(cat "$BUILD_DIR/web.js" "$BUILD_DIR/web.css" 2>/dev/null | sha256sum | cut -d' ' -f1)
        SCREENS_HASH=$(echo "${{ inputs.screens }}${{ inputs.base-url }}${{ inputs.route-format }}${{ inputs.route-key }}${{ inputs.viewport }}$(cat '${{ inputs.sitemap-file }}' 2>/dev/null)" | sha256sum | cut -d' ' -f1)
        BASE="prerender-${HASH}-${SCREENS_HASH}"

        if [ -z "${{ inputs.route-content }}" ]; then
          # Прежнее поведение: ключ строго по бандлу, попадание означает
          # «пререндер не нужен вовсе».
          echo "key=$BASE" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Поштучному режиму мало прочитать кэш — он ДОписывает манифест каждый
        # прогон. А запись в уже существующий ключ actions/cache пропускает
        # молча, без ошибки: манифест первого прогона застывает навсегда и
        # маршруты, которые он записал как «зависимость неизвестна»,
        # перерисовываются вечно. Поэтому ключ уникален на прогон, а прошлые
        # снимки достаются откатом по префиксу: сначала прогон с тем же
        # бандлом, потом любой предыдущий.
        echo "key=$BASE-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
        {
          echo "restore<<KEYS"
          echo "$BASE-"
          echo "prerender-"
          echo "KEYS"
        } >> "$GITHUB_OUTPUT"

    - name: Restore prerender cache
      id: prerender-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.detect.outputs.build-dir }}/*.html
          ${{ steps.detect.outputs.build-dir }}/**/index.html
          ${{ steps.detect.outputs.build-dir }}/sitemap.xml
          ${{ steps.detect.outputs.build-dir }}/robots.txt
          ${{ steps.detect.outputs.build-dir }}/prerender-state.json
        key: ${{ steps.cache-key.outputs.key }}
        # Частичный откат нужен только поштучному режиму: он получает прошлые
        # снимки и сам решает по каждому маршруту. Без манифеста ключ остаётся
        # строгим — поведение прежних потребителей не меняется ни на байт.
        restore-keys: ${{ steps.cache-key.outputs.restore }}

    - name: Install Puppeteer
      if: steps.prerender-cache.outputs.cache-hit != 'true' || inputs.route-content != ''
      shell: bash
      run: npm install --prefix "${{ github.action_path }}" puppeteer

    - name: Prerender pages
      if: steps.prerender-cache.outputs.cache-hit != 'true' || inputs.route-content != ''
      shell: bash
      run: |
        node "${{ github.action_path }}/prerender.mjs" \
          --build-dir="${{ steps.detect.outputs.build-dir }}" \
          --root-fqn="${{ steps.detect.outputs.root-fqn }}" \
          --base-url="${{ inputs.base-url }}" \
          --screens="${{ inputs.screens }}" \
          --route-format="${{ inputs.route-format }}" \
          --route-key="${{ inputs.route-key }}" \
          --sitemap-file="${{ inputs.sitemap-file }}" \
          --viewport="${{ inputs.viewport }}" \
          --timeout="${{ inputs.timeout }}" \
          --route-content="${{ inputs.route-content }}"
